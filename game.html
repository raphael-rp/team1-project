<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Quest Zone</title>
<link rel="stylesheet" href="style.css"> 

<!-- auth.js to authenticate user profile -->
<script src="auth.js"></script>
<script src="gamification.js"></script>

<style>
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #0f172a; color: #f1f5f9; }
    header { background: linear-gradient(135deg, #22c55e, #15803d); color: white; padding: 20px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    nav { display: flex; justify-content: center; gap: 10px; margin: 20px; flex-wrap: wrap; }
    nav a { padding: 10px 18px; background: #1e293b; color: #34d399; text-decoration: none; border-radius: 6px; border: 1px solid #334155; font-weight: 600; transition: all 0.2s; }
    nav a:hover { background: #334155; transform: translateY(-1px); }
    nav a.active { background: #22c55e; color: white; border-color: #22c55e; }
    
    .grid-container {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
        width: 90%;
        max-width: 800px; 
        margin: auto;
        padding-bottom: 50px;
    }

    .card {
        background: #1e293b;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
        border: 1px solid #334155;
    }
    .card-title {
        font-size: 1.25rem;
        font-weight: bold;
        margin-top: 0;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #34d399;
        border-bottom: 1px solid #334155;
        padding-bottom: 10px;
    }

    /* progress n badges UI */
    .profile-summary { text-align: center; padding: 15px 0; }
    .level-badge {
        background: radial-gradient(circle, #22c55e, #16a34a);
        color: white;
        font-size: 28px;
        font-weight: 800;
        padding: 20px 30px;
        border-radius: 50%;
        display: inline-block;
        margin-bottom: 15px;
        box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
    }
    .progress-container { width: 100%; background-color: #334155; border-radius: 9999px; margin: 15px 0; overflow: hidden; }
    .progress-bar { height: 16px; background: linear-gradient(90deg, #3b82f6, #60a5fa); border-radius: 9999px; transition: width 0.4s ease; width: 0%; }
    .streak-fire { font-size: 22px; color: #f97316; font-weight: bold; margin-top: 10px; }

    /* badge grid */
    .badges-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin-top: 15px; }
    .badge-item {
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 12px;
        text-align: center;
        opacity: 0.4;
        transition: all 0.3s;
    }
    .badge-item.unlocked { opacity: 1; border-color: #f59e0b; box-shadow: 0 0 10px rgba(245, 158, 11, 0.2); background: linear-gradient(135deg, #1e293b, #0f172a); }
    .badge-icon { font-size: 32px; margin-bottom: 6px; }
    .badge-name { font-size: 13px; font-weight: bold; color: #e2e8f0; }
    .badge-desc { font-size: 11px; color: #94a3b8; margin-top: 4px; }

    /* challanges */
    .challenge-list { display: flex; flex-direction: column; gap: 10px; }
    .challenge-item {
        background: #0f172a;
        padding: 14px;
        border-radius: 8px;
        border: 1px solid #334155;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .challenge-info { display: flex; flex-direction: column; gap: 4px; }
    .challenge-title { font-weight: bold; font-size: 14px; }
    .challenge-reward { font-size: 12px; color: #10b981; font-weight: bold; }
    .challenge-btn {
        background: #22c55e;
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
        width: auto;
    }
    .challenge-btn:hover { background: #16a34a; }
    .challenge-btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

    /* the leader board (optional may remove) */
    .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .leaderboard-table th { text-align: left; padding: 12px; background: #0f172a; color: #94a3b8; font-size: 13px; font-weight: bold; border-bottom: 2px solid #334155; }
    .leaderboard-table td { padding: 12px; border-bottom: 1px solid #334155; font-size: 14px; }
    .leaderboard-row.highlight-user { background: rgba(34, 197, 94, 0.1); border-left: 3px solid #22c55e; }
    .rank-cell { font-weight: bold; font-size: 15px; color: #e2e8f0; width: 45px; }
</style>
</head>

<body>

<header>
    <h1>✨ The Quest Zone ✨</h1>
</header>

<nav>
    <a href="index.html">Dashboard</a>
    <a href="add.html">Add Workout</a>
    <a href="calorie.html">Calorie Tracker</a>
    <a href="bmi.html">BMI</a>
    <a href="gamification.html" class="active">Quest Zone</a>
</nav>

<div class="grid-container">

    <!-- user profile -->
    <div class="card">
        <div class="card-title">👤 User Profile</div>
        <div class="profile-summary">
            <p style="margin-top: 0; font-size: 14px; color: #94a3b8;">User: <span id="userEmail" style="font-weight:bold; color: #34d399;"></span></p>
            <div class="level-badge">Lvl <span id="displayLevel">1</span></div>
            
            <h4 style="margin: 0; color: #e2e8f0;">Experience Points (XP)</h4>
            <div class="progress-container">
                <div id="xpBar" class="progress-bar"></div>
            </div>
            <p style="margin: 0; font-size: 13px; color: #94a3b8;"><span id="displayXP">0</span> / <span id="displayNextXP">100</span> XP to next level</p>

            <div class="streak-fire">
                🔥Streak: <span id="displayStreak">0</span> days
            </div>
        </div>
    </div>

    <!-- showcase badges -->
    <div class="card">
        <div class="card-title">🏅Unlocked Achievements</div>
        <div class="badges-grid" id="badgesContainer">
        </div>
    </div>

    <!-- 3. Daily Challenges -->
    <div class="card">
        <div class="card-title">⚡ Daily Quests</div>
        <div class="challenge-list" id="challengeContainer">
        </div>
    </div>

    <!-- Leaderboard -->
    <div class="card">
        <div class="card-title">🏆Leaderboard</div>
        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th>User</th>
                    <th>Hero Athlete</th>
                    <th>Level</th>
                    <th>Total XP</th>
                </tr>
            </thead>
            <tbody id="leaderboardContainer">
                <!-- Dynamically populated including user's live stats -->
            </tbody>
        </table>
    </div>

</div>

<script>
    requireLogin();

    // Challenge Configuration mapping
    const QUESTS = [
        { id: "quest_workout", title: "Complete any workout", reward: 40, action: "completing a workout" },
        { id: "quest_calorie", title: "Log a daily healthy meal", reward: 25, action: "logging a meal" },
        { id: "quest_water", title: "Hit your daily hydration goal", reward: 20, action: "drinking enough water" }
    ];

    // Mock Competitor database to show a realistic leaderboard standings ( May remove )
    const COMPETITORS = [
        { name: "Raphael_Secure", level: 4, totalXP: 380 },
        { name: "WeiHan_BMIMaster", level: 3, totalXP: 290 },
        { name: "Matt_CaloriePro", level: 3, totalXP: 210 },
        { name: "Akmal_Hydration", level: 2, totalXP: 120 }
    ];

    function loadDashboard() {
        let currentUser = getCurrentUser();
        document.getElementById("userEmail").innerText = currentUser;

        let allData = getGamificationData();
        let stats = allData[currentUser];

        // 1. Profile Stats
        document.getElementById("displayLevel").innerText = stats.level;
        document.getElementById("displayXP").innerText = stats.xp;
        let nextLevelXP = stats.level * 100;
        document.getElementById("displayNextXP").innerText = nextLevelXP;
        document.getElementById("displayStreak").innerText = stats.streak;

        let percentage = (stats.xp / nextLevelXP) * 100;
        document.getElementById("xpBar").style.width = percentage + "%";

        // 2. Load Achievements
        const badgesContainer = document.getElementById("badgesContainer");
        badgesContainer.innerHTML = AVAILABLE_BADGES.map(badge => {
            let isUnlocked = stats.unlockedBadges.includes(badge.id);
            return `
                <div class="badge-item ${isUnlocked ? 'unlocked' : ''}">
                    <div class="badge-icon">${badge.name.split(' ')[0]}</div>
                    <div class="badge-name">${badge.name.split(' ').slice(1).join(' ')}</div>
                    <div class="badge-desc">${badge.desc}</div>
                </div>
            `;
        }).join('');

        // 3. Load Active Quests
        const challengeContainer = document.getElementById("challengeContainer");
        challengeContainer.innerHTML = QUESTS.map(quest => {
            let isClaimed = stats.completedChallenges && stats.completedChallenges.includes(quest.id);
            return `
                <div class="challenge-item">
                    <div class="challenge-info">
                        <span class="challenge-title">${quest.title}</span>
                        <span class="challenge-reward">+${quest.reward} XP Reward</span>
                    </div>
                    <button class="challenge-btn" 
                        ${isClaimed ? 'disabled' : ''} 
                        onclick="claimChallenge('${quest.id}', ${quest.reward}, '${quest.action}')">
                        ${isClaimed ? '✓ Claimed' : 'Claim Reward'}
                    </button>
                </div>
            `;
        }).join('');

        // 4. Load Leaderboard Table (Compiles mock competitors + your live user) / OR JUST LIVE USER
        // Calculate dynamic total accumulated XP of live logged-in user
        let userTotalXP = 0;
        for (let l = 1; l < stats.level; l++) {
            userTotalXP += l * 100;
        }
        userTotalXP += stats.xp;

        let userLeaderboardProfile = {
            name: currentUser.split("@")[0] + " (You)",
            level: stats.level,
            totalXP: userTotalXP,
            isUser: true
        };

        // Combine, sort by total XP, and render
        let fullList = [...COMPETITORS, userLeaderboardProfile];
        fullList.sort((a, b) => b.totalXP - a.totalXP);

        const leaderboardContainer = document.getElementById("leaderboardContainer");
        leaderboardContainer.innerHTML = fullList.map((competitor, idx) => {
            return `
                <tr class="leaderboard-row ${competitor.isUser ? 'highlight-user' : ''}">
                    <td class="rank-cell">#${idx + 1}</td>
                    <td style="font-weight: ${competitor.isUser ? 'bold' : 'normal'}">
                        ${competitor.name}
                    </td>
                    <td>Lvl ${competitor.level}</td>
                    <td>${competitor.totalXP} XP</td>
                </tr>
            `;
        }).join('');
    }

    // Function to handle claiming a daily challenge
    function claimChallenge(id, reward, action) {
        let currentUser = getCurrentUser();
        let allData = getGamificationData();
        let stats = allData[currentUser];

        if (!stats.completedChallenges) {
            stats.completedChallenges = [];
        }

        // Save quest completion status
        stats.completedChallenges.push(id);
        saveGamificationData(allData);

        // add actual calculated XP using central engine logic
        addXP(reward, action);
        loadDashboard();
    }

    // external updts
    window.addEventListener('xpUpdated', loadDashboard);

    window.onload = loadDashboard;
</script>

</body>
</html>
