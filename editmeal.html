<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Meals</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
<h1>Edit Meals</h1>
</header>

<nav>
<a href="index.html">Dashboard</a>
<a href="add.html">Add Workout</a>
<a href="Calorie.html">Calorie Tracker</a>
</nav>

<div class="container">

<h2>Edit or Delete Meals</h2>

<div id="list"></div>

</div>

<script>

function load(){

let meals = JSON.parse(localStorage.getItem("meals")) || [];

if(meals.length==0){

document.getElementById("list").innerHTML="<p>No meals found.</p>";

return;

}

const today = new Date().toISOString().split("T")[0];

document.getElementById("list").innerHTML=meals.map((m,i)=>`

<div style="
border:1px solid #ddd;
padding:15px;
margin-bottom:15px;
border-radius:8px;
">

<label>Meal Name</label>

<input
id="meal${i}"
type="text"
value="${m.meal}"
>

<label>Calories</label>

<input
id="cal${i}"
type="number"
value="${m.calories}"
min="0"
>

<label>Date</label>

<input
id="date${i}"
type="date"
value="${m.date}"
max="${today}"
>

<div style="display:flex;gap:10px;margin-top:15px;">

<button onclick="save(${i})">
Save Changes
</button>

<button
onclick="removeMeal(${i})"
style="background:#ef4444;">
Delete
</button>

</div>

</div>

`).join("");

}

function save(i){

let meals=JSON.parse(localStorage.getItem("meals"))||[];

meals[i].meal=document.getElementById("meal"+i).value;

meals[i].calories=Number(document.getElementById("cal"+i).value);

meals[i].date=document.getElementById("date"+i).value;

localStorage.setItem("meals",JSON.stringify(meals));

alert("Meal Updated!");

}

function removeMeal(i){

if(confirm("Delete this meal?")){

let meals=JSON.parse(localStorage.getItem("meals"))||[];

meals.splice(i,1);

localStorage.setItem("meals",JSON.stringify(meals));

load();

}

}

load();

</script>

</body>
</html>
