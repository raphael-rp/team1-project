<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Meals</title>

<link rel="stylesheet" href="style.css">

<style>
.search-card{
    border:1px solid #ddd;
    border-radius:8px;
    padding:15px;
    margin-top:15px;
}
</style>

</head>

<body>

<header>
    <h1>Search Meals</h1>
</header>

<nav>
    <a href="index.html">Dashboard</a>
    <a href="add.html">Add Workout</a>
    <a href="Calorie.html">Calorie Tracker</a>
</nav>

<div class="container">

<h2>Search Meal</h2>

<input
type="text"
id="search"
placeholder="Enter meal name..."
onkeyup="searchMeal()"
>

<div id="results"></div>

</div>

<script>

function searchMeal(){

    let keyword =
    document.getElementById("search")
    .value
    .toLowerCase()
    .trim();

    let meals =
    JSON.parse(localStorage.getItem("meals")) || [];

    if(keyword===""){

        document.getElementById("results").innerHTML="";

        return;

    }

    let result = meals.filter(m =>
        m.meal.toLowerCase().includes(keyword)
    );

    if(result.length===0){

        document.getElementById("results").innerHTML=
        "<p>No meals found.</p>";

        return;

    }

    document.getElementById("results").innerHTML=result.map(m=>`

        <div class="search-card">

            <h3>${m.meal}</h3>

            <p><strong>Calories:</strong> ${m.calories}</p>

            <p><strong>Date:</strong> ${m.date}</p>

        </div>

    `).join("");

}

</script>

</body>
</html>
