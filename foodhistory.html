<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food History</title>

<link rel="stylesheet" href="style.css">

<style>
.history-card{
    border:1px solid #ddd;
    border-radius:8px;
    padding:15px;
    margin-bottom:15px;
    background:white;
}

.total{
    background:#22c55e;
    color:white;
    padding:15px;
    border-radius:8px;
    font-size:20px;
    margin-bottom:20px;
    text-align:center;
}
</style>

</head>

<body>

<header>
    <h1>Food History</h1>
</header>

<nav>
    <a href="index.html">Dashboard</a>
    <a href="add.html">Add Workout</a>
    <a href="Calorie.html">Calorie Tracker</a>
</nav>

<div class="container">

    <h2>Meal History</h2>

    <div class="total" id="totalCalories">
        Total Calories: 0
    </div>

    <div id="list"></div>

</div>

<script>

function loadMeals(){

    let meals = JSON.parse(localStorage.getItem("meals")) || [];

    if(meals.length===0){
        document.getElementById("list").innerHTML="<p>No meals recorded yet.</p>";
        document.getElementById("totalCalories").innerHTML="Total Calories: 0";
        return;
    }

    meals.sort((a,b)=>new Date(b.date)-new Date(a.date));

    let total = meals.reduce((sum,m)=>sum+Number(m.calories),0);

    document.getElementById("totalCalories").innerHTML =
        "Total Calories: " + total;

    document.getElementById("list").innerHTML = meals.map(m=>`

        <div class="history-card">

            <h3>${m.meal}</h3>

            <p><strong>Calories:</strong> ${m.calories}</p>

            <p><strong>Date:</strong> ${m.date}</p>

        </div>

    `).join("");

}

loadMeals();

</script>

</body>
</html>
